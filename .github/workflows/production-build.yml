name: 构建 QiMeet 生产制品

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: 安装依赖并验证
        run: |
          pnpm install --frozen-lockfile
          node --test test/auth-and-help.mjs test/registration-migration.mjs test/registration-notifications.mjs
      - name: 构建生产制品
        run: |
          pnpm build
          test -f .output/server/index.mjs
          node -e "require.resolve('mysql2/promise', { paths: [require('node:path').resolve('.output/server')] })"
          printf '%s\n' "$GITHUB_SHA" > REVISION
          # Iconify's emoji/test module is imported by its production entry point.
          find .output -type d \( -name test -o -name tests -o -name __tests__ -o -name coverage -o -name .git -o -name .cache \) \
            ! -path '.output/server/node_modules/@iconify/utils/lib/emoji/test' -prune -exec rm -r -- {} +
          tar --exclude='*.map' \
            -czf qimeet-linux.tar.gz .output database scripts/setup.mjs REVISION
          sha256sum qimeet-linux.tar.gz > qimeet-linux.tar.gz.sha256
      - name: 验证制品可独立启动
        run: |
          smoke="$(mktemp -d "$RUNNER_TEMP/qimeet-smoke.XXXXXX")"
          pid=''
          trap 'if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi; rm -r -- "$smoke"' EXIT
          tar -xzf qimeet-linux.tar.gz -C "$smoke"
          node --input-type=commonjs - "$smoke/.output/server/index.mjs" <<'NODE'
          const { createRequire } = require('node:module')
          const sharp = createRequire(process.argv[2])('sharp')
          sharp({ create: { width: 8, height: 8, channels: 3, background: '#fff' } })
            .webp().toBuffer().then((image) => {
              if (image.subarray(8, 12).toString() !== 'WEBP') throw new Error('Invalid bundled WebP encoder')
            }).catch((error) => { console.error(error); process.exitCode = 1 })
          NODE
          NITRO_HOST=127.0.0.1 NITRO_PORT=3086 node "$smoke/.output/server/index.mjs" > "$smoke/startup.log" 2>&1 &
          pid=$!
          for attempt in {1..30}; do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3086/brand/favicon.png; then exit 0; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$smoke/startup.log"
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qimeet-linux-${{ github.sha }}
          path: |
            qimeet-linux.tar.gz
            qimeet-linux.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
